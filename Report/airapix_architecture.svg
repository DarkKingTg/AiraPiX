<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#080c16"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111c33" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0c1424" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c471ed"/>
      <stop offset="100%" stop-color="#f64f59"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="accentCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#00f2fe"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#c471ed"/>
    </marker>
    <marker id="arrowEmerald" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#10b981"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#f59e0b"/>
    </marker>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-main { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 26px; fill: #ffffff; letter-spacing: 1.5px; }
    .title-sub { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 13px; fill: #94a3b8; letter-spacing: 0.5px; }
    .card-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.5px; }
    .text-body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 12px; fill: #cbd5e1; line-height: 1.4; }
    .text-dim { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 11px; fill: #64748b; }
    .badge { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="900" fill="url(#bgGradient)"/>

  <!-- Background Grid Pattern -->
  <g opacity="0.05">
    <path d="M 0 100 L 1200 100 M 0 200 L 1200 200 M 0 300 L 1200 300 M 0 400 L 1200 400 M 0 500 L 1200 500 M 0 600 L 1200 600 M 0 700 L 1200 700 M 0 800 L 1200 800" stroke="#ffffff" stroke-width="1"/>
    <path d="M 100 0 L 100 900 M 200 0 L 200 900 M 300 0 L 300 900 M 400 0 L 400 900 M 500 0 L 500 900 M 600 0 L 600 900 M 700 0 L 700 900 M 800 0 L 800 900 M 900 0 L 900 900 M 1000 0 L 1000 900 M 1100 0 L 1100 900" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(50, 45)">
    <rect x="-10" y="-15" width="1120" height="60" rx="12" fill="#0e172a" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="16" class="title-main">AIRAPIX AI COGNITIVE BRAIN &amp; CONTINUAL ARCHITECTURE</text>
    <text x="20" y="36" class="title-sub">Dual-System Hybrid Reasoning (MLA + SSM) | Doya Neuromodulation | Hebbian Plasticity | EWC 80/20 Replay | Vault Memory</text>
    <rect x="940" y="-3" width="150" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="1015" y="16" class="badge" fill="#38bdf8" text-anchor="middle">VOCAB: 24,000 BPE</text>
  </g>

  <!-- ==================== LAYER 1: PERCEPTION & TRUST ==================== -->
  <!-- Box 1A: Theory of Mind Perception -->
  <g transform="translate(50, 125)">
    <rect width="530" height="150" rx="10" fill="url(#cardDark)" stroke="#00f2fe" stroke-width="1.5"/>
    <rect x="0" y="0" width="530" height="32" rx="10" fill="#0f2847"/>
    <text x="15" y="21" class="card-title" fill="#00f2fe">[STAGE 1A] AFFECTIVE THEORY OF MIND (ToM)</text>
    <text x="440" y="21" class="badge" fill="#38bdf8">SYSTEM 1 REFLEX</text>
    
    <text x="15" y="55" class="text-body" font-weight="600" fill="#38bdf8">&#x2022; 8 Affective Dimensions:</text>
    <text x="155" y="55" class="text-body">Joy, Frustration, Burnout, Imposter Syndrome, Crisis, Fear, Confusion, Urgency</text>
    <text x="15" y="77" class="text-body" font-weight="600" fill="#38bdf8">&#x2022; Epistemic Perception:</text>
    <text x="155" y="77" class="text-body">Detects unstated needs, emotional valence [-1.0..+1.0], and arousal intensity</text>
    <text x="15" y="99" class="text-body" font-weight="600" fill="#38bdf8">&#x2022; Sub-50ms Triage:</text>
    <text x="155" y="99" class="text-body">Non-autoregressive intent extraction directly conditions System 2 directives</text>
    <text x="15" y="125" class="text-dim">Output: Directs internal thinking mode [BALANCED | DELIBERATE | GROUNDING | CRISIS]</text>
  </g>

  <!-- Box 1B: Dual-Track Trust Architecture -->
  <g transform="translate(620, 125)">
    <rect width="530" height="150" rx="10" fill="url(#cardDark)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="530" height="32" rx="10" fill="#063826"/>
    <text x="15" y="21" class="card-title" fill="#10b981">[STAGE 1B] DUAL-TRACK TRUST ARCHITECTURE</text>
    <text x="430" y="21" class="badge" fill="#34d399">EPISTEMIC SAFETY</text>

    <!-- User Track Visual Bar -->
    <text x="15" y="55" class="text-body" font-weight="600" fill="#34d399">&#x2022; Primary User Track:</text>
    <text x="155" y="55" class="text-body">Base: 50% &#x2192; Max Ceiling: 100% (Strengthened via shared milestones)</text>
    <rect x="155" y="65" width="220" height="10" rx="5" fill="#1e293b"/>
    <rect x="155" y="65" width="180" height="10" rx="5" fill="url(#greenGrad)"/>
    <text x="385" y="74" class="badge" fill="#34d399">82.5% [DYNAMIC]</text>

    <!-- Peer AI Track Visual Bar -->
    <text x="15" y="95" class="text-body" font-weight="600" fill="#f87171">&#x2022; Peer AI Model Track:</text>
    <text x="155" y="95" class="text-body">Base: 20% &#x2192; Hard Cap: 60% (Protection against hallucinations)</text>
    <rect x="155" y="105" width="220" height="10" rx="5" fill="#1e293b"/>
    <rect x="155" y="105" width="132" height="10" rx="5" fill="#ef4444"/>
    <text x="385" y="114" class="badge" fill="#f87171">60.0% [LOCKED CAP]</text>

    <text x="15" y="137" class="text-dim">Mandatory validation: Audits external model claims and prevents prompt injection</text>
  </g>

  <!-- ==================== LAYER 2: NEUROCHEMISTRY & MEMORY ==================== -->
  <!-- Box 2A: Neuromodulator & Somatics -->
  <g transform="translate(50, 305)">
    <rect width="530" height="175" rx="10" fill="url(#cardDark)" stroke="#c471ed" stroke-width="1.5"/>
    <rect x="0" y="0" width="530" height="32" rx="10" fill="#33103f"/>
    <text x="15" y="21" class="card-title" fill="#c471ed">[STAGE 2A] DOYA 4-CHEMICALS &amp; SOMATIC MARKERS</text>
    <text x="440" y="21" class="badge" fill="#e879f9">EMOTIONAL CORE</text>

    <text x="15" y="55" class="text-body" font-weight="600" fill="#e879f9">&#x2022; Dopamine &amp; Serotonin:</text>
    <text x="175" y="55" class="text-body">Reward anticipation, curiosity, and emotional stability baselines</text>
    <text x="15" y="77" class="text-body" font-weight="600" fill="#e879f9">&#x2022; Noradrenaline &amp; Cortisol:</text>
    <text x="175" y="77" class="text-body">Vigilance, error anomaly detection, and crisis stress modulation</text>
    <text x="15" y="99" class="text-body" font-weight="600" fill="#e879f9">&#x2022; Oxytocin &amp; Drives:</text>
    <text x="175" y="99" class="text-body">Relational bonding + Stamina, Curiosity, Flow State tracking</text>
    <text x="15" y="125" class="text-body" font-weight="600" fill="#f43f5e">&#x2022; Damasio Somatic Markers:</text>
    <text x="175" y="125" class="text-body">Intuitive gut check; flags unsafe, destructive or deceptive ops</text>
    <text x="15" y="152" class="text-dim">Homeostasis: Decays toward baselines per turn; modulates temperature &amp; top-k</text>
  </g>

  <!-- Box 2B: Hebbian Plasticity & Memory Vault -->
  <g transform="translate(620, 305)">
    <rect width="530" height="175" rx="10" fill="url(#cardDark)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="530" height="32" rx="10" fill="#082f49"/>
    <text x="15" y="21" class="card-title" fill="#38bdf8">[STAGE 2B] HEBBIAN PLASTICITY &amp; OBSIDIAN VAULT</text>
    <text x="430" y="21" class="badge" fill="#38bdf8">LONG-TERM MEMORY</text>

    <text x="15" y="55" class="text-body" font-weight="600" fill="#38bdf8">&#x2022; Hebbian Online Learning:</text>
    <text x="175" y="55" class="text-body">Associative matrix &#x0394;W = lr &#x00D7; reward; zero-backprop runtime updates</text>
    <text x="15" y="77" class="text-body" font-weight="600" fill="#38bdf8">&#x2022; Sub-ms BM25 Vault Search:</text>
    <text x="175" y="77" class="text-body">In-memory inverted index weighted by Damasio somatic dopamine</text>
    <text x="15" y="99" class="text-body" font-weight="600" fill="#38bdf8">&#x2022; Cross-Chat Journaling:</text>
    <text x="175" y="99" class="text-body">Saves YAML logs to C:\Users\WaveWalker\Aira-Vault\Conversations\</text>
    <text x="15" y="125" class="text-body" font-weight="600" fill="#38bdf8">&#x2022; Daily Note Integration:</text>
    <text x="175" y="125" class="text-body">Appends session recaps with [[wikilinks]] into 01 - Daily Notes</text>
    <text x="15" y="152" class="text-dim">Real-time persistence: State saved to Aira_Synaptic_Memory.json across restarts</text>
  </g>

  <!-- ==================== LAYER 3: DUAL-SYSTEM REASONING BACKBONE ==================== -->
  <g transform="translate(50, 508)">
    <rect width="1100" height="170" rx="12" fill="url(#accentCore)" stroke="#6366f1" stroke-width="2"/>
    <rect x="0" y="0" width="1100" height="32" rx="12" fill="#1e1b4b"/>
    <text x="20" y="22" class="card-title" fill="#a5b4fc">[CORE BACKBONE] DUAL-SYSTEM REASONING &amp; HYBRID MLA + SSM TRANSFORMER</text>
    <text x="960" y="22" class="badge" fill="#c7d2fe">SYSTEM 2 &lt;THINK&gt;</text>

    <!-- Sub-Block 1: Tokenizer & Think Tokens -->
    <g transform="translate(20, 45)">
      <rect width="320" height="105" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="15" y="22" class="badge" fill="#38bdf8">NATIVE DELIBERATION HEAD</text>
      <text x="15" y="44" class="text-body">&#x2022; Vocab: 24,000 ByteLevel BPE</text>
      <text x="15" y="64" class="text-body">&#x2022; Native Tokens: &lt;think&gt; (4) / &lt;/think&gt; (5)</text>
      <text x="15" y="86" class="text-body">&#x2022; Empathy Guidance Injected into Prompt</text>
    </g>

    <!-- Sub-Block 2: Interleaved Architecture -->
    <g transform="translate(360, 45)">
      <rect width="360" height="105" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
      <text x="15" y="22" class="badge" fill="#818cf8">INTERLEAVED LAYER BLOCKS</text>
      <text x="15" y="44" class="text-body">&#x2022; Block 4k: Multi-Head Latent Attention (MLA)</text>
      <text x="25" y="62" class="text-dim">Low-Rank KV Compression (93% VRAM savings) + RoPE</text>
      <text x="15" y="82" class="text-body">&#x2022; Block 4k+1..3: Diagonal State Space Model (SSM)</text>
      <text x="25" y="98" class="text-dim">O(N) Linear-complexity recurrent context mixer</text>
    </g>

    <!-- Sub-Block 3: FFN & Output Head -->
    <g transform="translate(740, 45)">
      <rect width="340" height="105" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="15" y="22" class="badge" fill="#34d399">EXECUTION &amp; LM HEAD</text>
      <text x="15" y="44" class="text-body">&#x2022; SwiGLU FFN: 4.0x hidden expansion</text>
      <text x="15" y="64" class="text-body">&#x2022; Pre-RMSNorm across all hidden layers</text>
      <text x="15" y="86" class="text-body">&#x2022; Tied Embeddings with Output Head LM</text>
    </g>
  </g>

  <!-- ==================== LAYER 4: CONTINUAL LEARNING ==================== -->
  <!-- Box 4A: Strategy 7 Replay & EWC -->
  <g transform="translate(50, 705)">
    <rect width="530" height="145" rx="10" fill="url(#cardDark)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="530" height="32" rx="10" fill="#451a03"/>
    <text x="15" y="21" class="card-title" fill="#f59e0b">[STRATEGY 7] ANTI-CATASTROPHIC FORGETTING (EWC &amp; REPLAY)</text>
    <text x="440" y="21" class="badge" fill="#fbbf24">STABILITY</text>

    <text x="15" y="55" class="text-body" font-weight="600" fill="#fbbf24">&#x2022; 80/20 Experience Replay Mixture:</text>
    <text x="215" y="55" class="text-body">80% foundational tokens + 20% fresh experience</text>
    <text x="15" y="77" class="text-body" font-weight="600" fill="#fbbf24">&#x2022; Elastic Weight Consolidation:</text>
    <text x="215" y="77" class="text-body">Fisher Information diagonal F_i protects core weights</text>
    <text x="15" y="99" class="text-body" font-weight="600" fill="#fbbf24">&#x2022; Quadratic Penalty Loss:</text>
    <text x="215" y="99" class="text-body">L_EWC = (lambda/2) * sum( F_i * (&#x03B8;_i - &#x03B8;*_i)^2 )</text>
    <text x="15" y="125" class="text-dim">Result: Absorbs new domain knowledge without forgetting core code &amp; math</text>
  </g>

  <!-- Box 4B: Strategy 5 Autonomous Dream Cycles -->
  <g transform="translate(620, 705)">
    <rect width="530" height="145" rx="10" fill="url(#cardDark)" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="0" y="0" width="530" height="32" rx="10" fill="#3b0764"/>
    <text x="15" y="21" class="card-title" fill="#a855f7">[STRATEGY 5] AUTONOMOUS DREAM CONSOLIDATION CYCLES</text>
    <text x="440" y="21" class="badge" fill="#c084fc">PLASTICITY</text>

    <text x="15" y="55" class="text-body" font-weight="600" fill="#c084fc">&#x2022; Vault Seed Harvesting:</text>
    <text x="180" y="55" class="text-body">Pulls unstated needs &amp; challenges from Conversations/</text>
    <text x="15" y="77" class="text-body" font-weight="600" fill="#c084fc">&#x2022; System 2 Self-Play Synthesis:</text>
    <text x="180" y="77" class="text-body">Generates step-by-step &lt;think&gt; deliberation traces</text>
    <text x="15" y="99" class="text-body" font-weight="600" fill="#c084fc">&#x2022; Somatic Filtering &amp; Ingestion:</text>
    <text x="180" y="99" class="text-body">Filters hallucinations (valence &#x2265; 0.60) &#x2192; training buffer</text>
    <text x="15" y="125" class="text-dim">Command: Triggerable via /dream [count] in chat CLI or during GPU idle time</text>
  </g>

  <!-- ==================== FLOW ARROWS ==================== -->
  <path d="M 315 275 L 315 305" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowCyan)"/>
  <path d="M 885 275 L 885 305" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowEmerald)"/>
  <path d="M 315 480 L 315 508" stroke="#c471ed" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <path d="M 885 480 L 885 508" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <path d="M 315 678 L 315 705" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <path d="M 885 678 L 885 705" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)"/>

</svg>
