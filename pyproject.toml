[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airapix"
version = "0.1.0"
description = "Local-first small AI companion model and training pipeline."
requires-python = ">=3.11"
dependencies = [
  "torch>=2.3",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "matplotlib>=3.8",
  "datasets>=2.20",
  "huggingface_hub>=0.24",
  "tokenizers>=0.19",
  "ftfy>=6.2",
  "langdetect>=1.0.9",
  "datasketch>=1.6",
]

[tool.setuptools.packages.find]
include = ["airapix*"]
