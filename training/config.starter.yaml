model:
  preset: tiny
  vocab_size: 12000
  context_len: 128
  dropout: 0.0
  gradient_checkpointing: false

data:
  tokenizer_path: airapix/model/tokenizer/tokenizer.json
  train_path: dataset_builder/data/processed/train.jsonl
  val_path: dataset_builder/data/processed/val.jsonl
  category_shards:
    text: dataset_builder/data/processed/train_text.jsonl
    chat: dataset_builder/data/processed/train_chat.jsonl
    reasoning: dataset_builder/data/processed/train_reasoning.jsonl
    code: dataset_builder/data/processed/train_code.jsonl
    tool_use: dataset_builder/data/processed/train_tool_use.jsonl
  mixture_weights:
    text: 0.20
    chat: 0.20
    reasoning: 0.20
    code: 0.20
    tool_use: 0.20
  use_compression_prior: true
  manifest_path: dataset_builder/data/manifests/dataset_manifest.json
  num_workers: 0

training:
  output_dir: runs/starter_12k_cpu
  seed: 42
  max_steps: 20
  micro_batch_size: 1
  target_effective_batch_size: 4
  eval_interval: 5
  eval_batches: 2
  checkpoint_interval: 10
  early_stopping_patience: 3
  log_interval: 1
  precision: fp32
  grad_clip_norm: 1.0

optimizer:
  name: muon_adamw
  peak_lr: 0.0004
  min_lr_ratio: 0.1
  warmup_fraction: 0.1
  weight_decay: 0.01
  adamw_betas: [0.9, 0.95]
  adamw_eps: 0.00000001
  muon_momentum: 0.95
  muon_ns_steps: 2
  muon_lr_multiplier: 1.0
  adamw_lr_multiplier: 1.0

probe:
  presets: [tiny]
  micro_batch_sizes: [1]
  memory_limit_gb: 3.5
  steps: 1

distillation:
  teacher_model: Qwen/Qwen2.5-7B-Instruct
  enabled: false
  max_new_tokens: 128
  temperature: 0.7
  top_p: 0.9
  load_in_4bit: true
  device_map: auto

regmix:
  enabled: true
  proxy_output_dir: runs/regmix_proxy_starter
  proxy_model_preset: tiny
  proxy_steps: 20
  candidate_mixtures: 8
  ridge_alpha: 0.1
  categories: [text, chat, reasoning, code, tool_use]
